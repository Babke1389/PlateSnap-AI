name: Build & Submit to Play Store (EAS)

on:
  workflow_dispatch: {}

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Link or create EAS project
        run: eas init --non-interactive --force

      - name: Write Play Console service account key
        run: echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > google-service-account.json
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}

      - name: Build Android App Bundle and submit to Play Store (internal track)
        run: eas build --platform android --profile production --non-interactive --wait --auto-submit-with-profile=production
